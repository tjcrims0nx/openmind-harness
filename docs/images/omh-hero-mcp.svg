    <circle cx="31" cy="31" r="12" fill="none" stroke="#12e5f6" stroke-width="3"/><path d="M31 18V44M18 31H44" stroke="#12e5f6" stroke-width="2"/>
    <text x="60" y="38" fill="#e7fcff">MCP Servers</text><text x="60" y="61" fill="#88aac5" font-size="13" font-weight="400">Tools • Data • APIs</text>
    <path d="M210 42H310L362 95" fill="none" stroke="#24eaff" stroke-width="2" opacity=".65"/>
  </g>
  <g transform="translate(60 198)">
