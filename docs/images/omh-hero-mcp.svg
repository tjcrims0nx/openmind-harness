  <path d="M59 -10 129 28V105L59 145 -11 105V28Z" fill="none" stroke="#ac72ff" stroke-width="3" stroke-opacity=".7"/>
</g>
<text x="740" y="233" text-anchor="middle" fill="#f7faff" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="75" letter-spacing="1">OpenMind <tspan fill="url(#neon)">Harness</tspan></text>
<text x="740" y="271" text-anchor="middle" fill="#9bc7e9" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="4">LOCAL AI AGENT RUNTIME  •  MODEL CONTEXT PROTOCOL</text>
<text x="740" y="313" text-anchor="middle" fill="#daeaff" font-family="Arial,Helvetica,sans-serif" font-size="20">Connect providers, MCP tools and repeatable workflows.</text>
<g font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">
