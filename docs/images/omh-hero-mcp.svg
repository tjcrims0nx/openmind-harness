<text x="740" y="396" text-anchor="middle" fill="#cffaff" font-family="Arial,Helvetica,sans-serif" font-size="20" letter-spacing="2">MCP  ·  PROVIDERS  ·  AGENTS  ·  WORKFLOWS  ·  MEMORY  ·  SANDBOX  ·  DASHBOARD</text>
<text x="740" y="432" text-anchor="middle" fill="#8c9eba" font-family="Arial,Helvetica,sans-serif" font-size="14" letter-spacing="2">LINUX    /    macOS    /    WINDOWS    /    ANDROID + TERMUX</text>
