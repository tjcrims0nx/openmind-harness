<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="460" viewBox="0 0 1480 460" role="img" aria-labelledby="title desc">
<title id="title">OpenMind Harness — AI agents, MCP, multi-provider, workflows, memory and sandbox</title>
<desc id="desc">Neon cyan and purple cyberpunk hero with OpenMind Harness branding and connected MCP, Providers, Agents, Workflows, Memory, Sandbox and Dashboard modules.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#030916"/><stop offset=".52" stop-color="#0a1030"/><stop offset="1" stop-color="#06091c"/></linearGradient>
  <linearGradient id="neon" x2="1"><stop stop-color="#16e8ff"/><stop offset=".53" stop-color="#72b5ff"/><stop offset="1" stop-color="#c66aff"/></linearGradient>
  <linearGradient id="box" x2="0" y2="1"><stop stop-color="#101d37" stop-opacity=".94"/><stop offset="1" stop-color="#080e22" stop-opacity=".88"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
  <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#19cdf4" stroke-opacity=".09"/></pattern>
</defs>
<rect width="1480" height="460" fill="url(#bg)"/>
<rect width="1480" height="460" fill="url(#grid)"/>
<path d="M0 400H1480 M0 60H1480" stroke="#23ddff" stroke-opacity=".25"/>
<path d="M0 0H320L370 62H535M1480 0H1160L1100 62H940M0 460H400L455 395H525M1480 460H1080L1020 395H955" fill="none" stroke="url(#neon)" stroke-width="3" opacity=".68"/>
<ellipse cx="746" cy="185" rx="388" ry="130" fill="#14dfff" opacity=".11" filter="url(#glow)"/>
<g transform="translate(681 35)">
