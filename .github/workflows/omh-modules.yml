name: OMH module tests
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: omh-runtime-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Test OMH modules
        run: node --test modules/*.test.mjs

      - name: Validate runtime and chat module syntax
        run: |
          node --check scripts/omh-live.mjs
          node --check scripts/omh-dashboard.mjs
          node --check lib/omh-chat.mjs

      - name: Smoke-test OMH runtime CLI
        run: |
          node scripts/omh-runtime.mjs status
          node scripts/omh-runtime.mjs workflow:run '{"name":"ci-smoke","steps":[{"kind":"workspace.read","input":{"path":"README.md"}}]}'
          node scripts/omh-runtime.mjs task:list


  portable-runtime:
    name: portable runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Portable module tests
        run: node --test modules/doctor.test.mjs modules/mcp.test.mjs modules/smart-router.test.mjs
      - name: Verify runtime status and diagnostics
        run: |
          node scripts/omh-runtime.mjs status
          node scripts/omh-runtime.mjs doctor
      - name: Ensure unsupported platforms fail closed for sandbox execution
        shell: bash
        run: |
          node --input-type=module -e "import assert from 'node:assert/strict'; import {runSandbox} from './modules/sandbox.mjs'; await assert.rejects(runSandbox({workspace:process.cwd(),command:'node',args:['-v']}), /Sandbox unavailable/);"

  dashboard:
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install browser test driver
        run: python -m pip install playwright==1.56.0
      - name: Install WebKit and its system libraries
        if: matrix.browser == 'webkit'
        run: python -m playwright install --with-deps webkit
      - name: Exercise the installed dashboard
        env:
          OMH_SMOKE_BROWSER: ${{ matrix.browser }}
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-screenshots"
          OMH_SCREENSHOT_DIR="$RUNNER_TEMP/dashboard-screenshots" python scripts/smoke-dashboard.py
      - uses: actions/upload-artifact@v6
        with:
          name: omh-dashboard-screenshots-${{ matrix.browser }}
          path: ${{ runner.temp }}/dashboard-screenshots
          if-no-files-found: error

  sandbox:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y bubblewrap
      - name: Smoke-test Linux sandbox isolation
        run: node scripts/smoke-sandbox.mjs
        env:
          OMH_SANDBOX_HOST_FIXTURE: host-only
