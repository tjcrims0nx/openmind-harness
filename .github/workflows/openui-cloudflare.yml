name: Deploy OMH React + API to Cloudflare (free preview)
on:
  push:
    branches: [feat/free-openui-pages-preview]
    paths:
      - 'frontend-next/**'
      - 'workers/openui-backend.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/openui-cloudflare.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: omh-cloudflare-preview
  cancel-in-progress: true
jobs:
  test-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare Worker JavaScript
        run: |
          node --check workers/openui-backend.mjs
          node --test workers/openui-backend.test.mjs
      - name: Build React OpenUI frontend
        working-directory: frontend-next
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify one-origin preview config
        run: |
          node -e "const fs=require('fs'); const conf=JSON.parse(fs.readFileSync('wrangler.jsonc')); if(!fs.existsSync(conf.assets.directory+'/index.html')||conf.assets.binding!=='ASSETS'||!conf.assets.run_worker_first.includes('/api/*'))process.exit(1);"
      - name: Deploy Worker and bundled static assets
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
      - name: Explain missing Cloudflare setup
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: |
          echo "::notice::Build finished. To deploy, add new CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."
          echo "The exposed token from chat must be revoked and replaced before use."
