name: OMH OpenUI frontend candidate
on:
  push:
    branches: [main]
    paths:
      - 'frontend-next/**'
      - '.github/workflows/openui-frontend.yml'
  pull_request:
    paths:
      - 'frontend-next/**'
      - '.github/workflows/openui-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install candidate UI dependencies
        run: npm install --no-audit --no-fund
      - name: Validate TypeScript and build frontend
        run: npm run build
      - name: Verify branded assets and chat shell
        run: |
          node -e "const fs=require('fs');const html=fs.readFileSync('dist/index.html','utf8');if(!html.includes('assets/'))process.exit(1);if(!fs.existsSync('dist/app-icon.webp'))process.exit(1);"
      - name: Upload unpromoted UI candidate
        uses: actions/upload-artifact@v4
        with:
          name: omh-openui-frontend-candidate
          path: frontend-next/dist/
          if-no-files-found: error
          retention-days: 7

  browser:
    name: Mobile and desktop Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install candidate UI and browser
        run: |
          npm install --no-audit --no-fund
          npm run build
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run candidate frontend with mock API
        run: |
          npm run preview -- --port 5181 > /tmp/omh-openui-preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5181/ -o /dev/null && exit 0
            sleep 1
          done
          cat /tmp/omh-openui-preview.log
          exit 1
      - name: Verify mobile and desktop layouts and capture screenshots
        env:
          OMH_OPENUI_SCREENSHOT_DIR: ${{ runner.temp }}/omh-openui
        run: python scripts/smoke-openui.py
      - name: Upload real browser screenshots
        uses: actions/upload-artifact@v4
        with:
          name: omh-openui-browser-screenshots
          path: ${{ runner.temp }}/omh-openui/*.png
          if-no-files-found: error
          retention-days: 7
