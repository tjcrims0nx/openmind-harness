name: Installer test

on:
  push:
    branches: [main]
    paths:
      - 'linux-setup.sh'
      - 'macos-setup.sh'
      - 'windows-setup.ps1'
      - 'termux-setup.sh'
      - 'opencode.json'
      - 'scripts/install-omh-runtime.mjs'
  pull_request:
    paths:
      - 'linux-setup.sh'
      - 'macos-setup.sh'
      - 'windows-setup.ps1'
      - 'termux-setup.sh'
      - 'opencode.json'
      - 'scripts/install-omh-runtime.mjs'

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            shell: bash
          - os: macos-15
            shell: bash
          - os: windows-2022
            shell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Run Linux installer (no launch)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: bash linux-setup.sh --no-launch

      - name: Run macOS installer (no launch)
        if: matrix.os == 'macos-15'
        shell: bash
        run: bash macos-setup.sh --no-launch

      - name: Run Windows installer (no launch)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: .\windows-setup.ps1 -NoLaunch

      - name: Verify opencode installed
        shell: ${{ matrix.shell }}
        run: opencode --version

      - name: Verify installed config (Linux/macOS)
        if: matrix.os != 'windows-2022'
        shell: bash
        run: |
          cfg="$HOME/.config/opencode/opencode.json"
          test -f "$cfg" || { echo "config not installed: $cfg"; exit 1; }
          grep -q 'gemini-3\.5-flash-lite' "$cfg" || { echo "config default is not gemini-3.5-flash-lite"; exit 1; }
          echo "config installed: $cfg (default gemini-3.5-flash-lite)"

      - name: Verify installed config (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          $cfg = Join-Path $env:USERPROFILE '.config\opencode\opencode.json'
          if (-not (Test-Path $cfg)) { throw "config not installed: $cfg" }
          $text = Get-Content $cfg -Raw
          if ($text -notmatch 'gemini-3\.5-flash-lite') { throw "config default is not gemini-3.5-flash-lite" }
          Write-Host "config installed: $cfg (default gemini-3.5-flash-lite)"
