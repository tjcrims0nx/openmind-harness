name: OMH free public UI preview (GitHub Pages)
on:
  push:
    branches: [feat/free-openui-pages-preview]
    paths:
      - 'frontend-next/**'
      - '.github/workflows/openui-free-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: omh-free-pages-preview
  cancel-in-progress: true
jobs:
  deploy-demo:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and build static OMH demo
        working-directory: frontend-next
        env:
          OMH_PAGES_PREVIEW: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static React demo
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-next/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
