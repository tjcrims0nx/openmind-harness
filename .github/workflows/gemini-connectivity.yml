name: Gemini secret connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-connectivity.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Gemini API key and model access without printing credentials
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is missing"
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          url = "https://generativelanguage.googleapis.com/v1beta/models"
          req = urllib.request.Request(url, headers={"x-goog-api-key": os.environ["GEMINI_API_KEY"]})
          try:
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              print(f"Gemini API authentication/model listing failed (HTTP {exc.code})")
              raise SystemExit(1)
          except Exception as exc:
              print(f"Gemini connectivity failed ({type(exc).__name__})")
              raise SystemExit(1)
          models = [m.get("name", "") for m in data.get("models", [])]
          print(f"Gemini authentication succeeded; received {len(models)} models (first page).")
          target = "models/gemini-3.8-flash"
          if target not in models and data.get("nextPageToken"):
              print("Target model not in first page; full availability not confirmed.")
          elif target not in models:
              print("WARNING: configured gemini-3.8-flash not listed by this key.")
          else:
              print("Configured Gemini model appears in available model list.")
          PY
