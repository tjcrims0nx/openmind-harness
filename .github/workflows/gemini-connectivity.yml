name: Gemini secret connectivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gemini-connectivity.yml'
      - 'scripts/smoke-gemini.sh'
      - 'scripts/smoke-gemini-fixture.py'
      - 'opencode.json'
      - 'scripts/smoke-opencode-cancellation.mjs'
      - 'modules/opencode-session.mjs'
      - 'modules/agent-runner.mjs'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mode: [fixture, live]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenCode
        shell: bash
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/omh-opencode"
          mkdir -p "$release"
          curl --fail --silent --show-error --location --retry 2 \
            https://github.com/anomalyco/opencode/releases/download/v1.19.6/opencode-linux-x64.tar.gz \
            --output "$release/opencode-linux-x64.tar.gz"
          (
            cd "$release"
            echo '47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057  opencode-linux-x64.tar.gz' | sha256sum --check
            tar -xzf opencode-linux-x64.tar.gz
          )
          echo "$release" >> "$GITHUB_PATH"
      - name: Verify Gemini calls an installed OMH MCP tool through OpenCode
        env:
          GEMINI_API_KEY: ${{ matrix.mode == 'live' && secrets.GEMINI_API_KEY || '' }}
        run: bash scripts/smoke-gemini.sh ${{ matrix.mode }}
      - name: Verify native session cancellation and scoped memory
        if: matrix.mode == 'fixture'
        run: node scripts/smoke-opencode-cancellation.mjs
