<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#040910">
  <title>Runtime dashboard · OpenMind Harness</title>
  <link rel="icon" href="/app-icon.png">
  <link rel="stylesheet" href="/dashboard.css">
  <script type="module" src="/dashboard.js"></script>
</head>
<body>
  <aside class="rail" id="rail">
    <div class="brand"><img src="/app-icon.png" width="56" height="56" alt=""><div><b>OMH</b><small>OPENMIND<br>HARNESS</small></div></div>
    <nav aria-label="Workspace navigation" id="navigation"></nav>
    <div class="health"><span class="indicator"></span> <strong id="health-title">Connecting</strong><p id="health-detail">Reading workspace</p><div class="wave" aria-hidden="true"></div></div>
  </aside>
  <header class="topbar">
    <button id="menu" aria-controls="rail" aria-expanded="false" aria-label="Workspace navigation"></button>
    <div class="location"><img src="/app-icon.png" width="26" height="26" alt="OpenMind Harness"><span data-icon="workspaces"></span>Workspace <span class="slash">/</span> <strong>Local</strong></div>
    <nav id="shortcuts" aria-label="Quick views"></nav>
    <div class="connection"><i class="indicator"></i><span id="connection" role="status">Connecting</span></div>
    <button id="refresh" aria-label="Refresh runtime state" title="Refresh runtime state"></button>
  </header>
  <main>
    <div id="error" role="alert" hidden></div>
    <div id="hub">
      <section class="hero" aria-label="OpenMind Harness"><h1>OMH</h1><p>OPENMIND HARNESS</p><small>Multi-agent <i>·</i> Memory <i>·</i> Workflows <i>·</i> Sandbox</small></section>
      <form class="query" id="search-form" role="search">
        <div class="query-line"><span data-icon="console"></span><input id="search" type="search" placeholder="Search this workspace…" aria-label="Search this workspace"><button class="send" aria-label="Run search"><span data-icon="arrow"></span></button></div>
        <div class="query-options"><label for="scope"><span data-icon="list"></span>Search in</label><select id="scope"><option value="all">All runtime views</option></select></div>
      </form>
      <section id="results" class="pane" aria-label="Search results" hidden><div class="section-head"><h2>Search results</h2><button id="clear">Clear</button></div><div id="matches" aria-live="polite"></div></section>
      <nav class="tiles" id="tiles" aria-label="Explore harness features"></nav>
    </div>
    <section class="pane detail" id="detail" hidden><div class="section-head"><h1 id="view-heading" tabindex="-1"></h1><label id="filter-label">Status <select id="filter"><option value="all">All statuses</option><option>queued</option><option>running</option><option>completed</option><option>failed</option><option>cancelled</option></select></label></div><div id="activity"></div></section>
    <section class="dock pane" aria-label="Runtime inspector"><div id="dock-tabs" role="tablist" aria-label="Inspector views"></div><div id="dock-content" role="tabpanel" tabindex="0"></div></section>
  </main>
  <aside class="telemetry" aria-label="Runtime activity">
    <section class="pane"><h2><span data-icon="agents"></span>Agent team <em id="agent-count"></em></h2><div id="agent-feed"></div></section>
    <section class="pane"><h2><span data-icon="list"></span>Task queue <em id="task-count"></em></h2><div id="task-feed"></div></section>
    <section class="pane"><h2><span data-icon="traces"></span>Recent activity</h2><div id="trace-feed"></div></section>
  </aside>
</body>
</html>
